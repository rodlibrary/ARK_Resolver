# Weekly ARK matching for the Rod Library resolver.
#
# A pipeline schedule (Build > Pipeline schedules) runs match-preservica every week:
# it downloads the ARK scripts from GitHub (rodlibrary/Scripts, arks/), reads the
# ARK fields of every Preservica asset's MODS, fills in the Preservica reference
# (and portal target) of each ARK in resolve.csv, and pushes resolve.csv and
# match_report.csv back to this repository when they changed.
#
# CI/CD variables (Settings > CI/CD > Variables), all Masked:
#   PRESERVICA_USERNAME, PRESERVICA_PASSWORD   the Preservica service account
#   GITLAB_TOKEN                               project access token (api scope) that can push to main
# Optional: DRY_RUN=true (report only), OVERWRITE=true, SCRIPTS_REF (a branch, tag or
# commit of rodlibrary/Scripts; default main), PRESERVICA_PORTAL_URL.

stages:
  - check
  - match

default:
  image: python:3.12-slim

variables:
  SCRIPTS_REF: main
  # The scripts push to this project through the API, using these.
  GITLAB_URL: $CI_SERVER_URL
  GITLAB_PROJECT: $CI_PROJECT_PATH
  GITLAB_BRANCH: $CI_DEFAULT_BRANCH

# Commits the scripts make to resolve.csv run only the quick check below, never the
# matching, so a push can't start another push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [resolve.csv]

.download-scripts: &download-scripts
  - |
    python3 - <<'PY'
    import os, sys, urllib.request
    ref = os.environ.get("SCRIPTS_REF") or "main"
    os.makedirs("arks", exist_ok=True)
    for name in ("generate_arks.py", "match_preservica.py", "check_gitlab.py"):
        url = f"https://raw.githubusercontent.com/rodlibrary/Scripts/{ref}/arks/{name}"
        try:
            with urllib.request.urlopen(url, timeout=60) as r, open(os.path.join("arks", name), "wb") as f:
                f.write(r.read())
        except Exception as e:
            sys.exit(f"Couldn't download {url}: {e}. The runner needs internet access to GitHub.")
    print(f"Downloaded the ARK scripts from rodlibrary/Scripts@{ref}.")
    PY

# Every change to resolve.csv (by the scripts or by hand) is checked, since Apache reads it.
check-resolve-csv:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  script:
    - |
      python3 - <<'PY'
      import csv, sys
      expected = ["dc_path", "dc_article", "ark", "preservica_ref", "target_url", "status", "notes"]
      with open("resolve.csv", newline="", encoding="utf-8-sig") as f:
          reader = csv.DictReader(f)
          header, rows = reader.fieldnames or [], list(reader)
      problems = []
      if header != expected:
          problems.append(f"the header is {header}, expected {expected}")
      seen = {}
      for n, r in enumerate(rows, start=2):
          ark, status = (r.get("ark") or "").strip(), (r.get("status") or "").strip()
          if not ark:
              problems.append(f"row {n}: no ark")
          elif ark in seen:
              problems.append(f"row {n}: ark {ark} is also on row {seen[ark]}")
          seen.setdefault(ark, n)
          if status not in ("active", "withdrawn", "unmatched"):
              problems.append(f"row {n}: status {status!r} isn't active, withdrawn or unmatched")
          if status == "active" and not (r.get("target_url") or "").strip():
              problems.append(f"row {n}: active but no target_url")
      print(f"resolve.csv: {len(rows)} row(s).")
      if problems:
          print("Problems:\n  " + "\n  ".join(problems[:50]))
          sys.exit(1)
      print("No problems found.")
      PY

# Run by hand (Build > Pipelines > Run pipeline, then the play button) to test the
# connection and the token from the runner, including a test push to a temporary branch.
check-gitlab:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  script:
    - *download-scripts
    - cd arks && python3 check_gitlab.py

match-preservica:
  stage: match
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  resource_group: resolver-push        # never two pushes at once
  timeout: 2h
  script:
    - test -n "$PRESERVICA_USERNAME" && test -n "$PRESERVICA_PASSWORD" && test -n "$GITLAB_TOKEN" || { echo "Add the CI/CD variables PRESERVICA_USERNAME, PRESERVICA_PASSWORD and GITLAB_TOKEN (Settings > CI/CD > Variables)."; exit 1; }
    - *download-scripts
    - cd arks
    - args="--from-gitlab --push-to-gitlab --push-report"
    - if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
    - if [ "$OVERWRITE" = "true" ]; then args="$args --overwrite"; fi
    - python3 match_preservica.py $args
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - arks/match_report.csv